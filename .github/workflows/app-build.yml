name: Build PAMS App via CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-with: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Tự động sinh cấu hình Maven Wrapper sạch ngay trên máy ảo Ubuntu
      - name: Generate Maven Wrapper on Runner
        run: mvn wrapper:wrapper

      # Cấp quyền thực thi cho file wrapper vừa sinh ra
      - name: Permission for Executable
        run: chmod +x mvnw

      # Thực hiện đóng gói ứng dụng
      - name: Build with Maven Wrapper
        run: ./mvnw clean package